name: Update marketplace SHA

# auto-release가 만드는 "chore(release): x.y.z" 커밋은 GITHUB_TOKEN으로
# push되어 push 이벤트를 일으키지 않는다(재귀 방지). 그래서 릴리스가 날
# 때마다 marketplace.json이 낡은 채로 남았다. workflow_run은 그 제약을
# 받지 않으므로 릴리스가 끝난 뒤 이어서 돈다.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude-plugin/marketplace.json'
  workflow_run:
    workflows: ['Auto release']
    types: [completed]
    branches: [main]

permissions:
  contents: write

# auto-release.yml과 같은 그룹을 써서 직렬화한다. 둘 다 main push에
# 반응해 각자 커밋을 push하므로, 동시에 돌면 한쪽이 non-fast-forward로
# 튕긴다.
concurrency:
  group: main-push-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-sha:
    runs-on: ubuntu-latest
    steps:
      # ref를 명시한다. workflow_run으로 들어오면 github.sha는 auto-release가
      # "시작된" 커밋이라 그 뒤에 얹힌 범프 커밋을 놓친다.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Update SHA in marketplace.json
        run: |
          SHA=$(git rev-parse HEAD)
          sed -i "s/\"sha\": \"[a-f0-9]*\"/\"sha\": \"$SHA\"/" .claude-plugin/marketplace.json

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet .claude-plugin/marketplace.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "chore: marketplace.json SHA 자동 갱신"
          git push
