name: Auto release

# 커밋 타입에서 다음 버전을 정해 빌드하고, plugin.json을 올린 뒤 태그와
# Release를 만든다.
#
# 다른 플러그인들은 claude-plugins의 재사용 워크플로우를 그대로 호출하지만
# 이 레포는 그럴 수 없다. commands/setup.md가 plugin.json의 version으로
# 다운로드 URL을 조립하기 때문이다.
#
#   BASE=".../releases/download/v${PLUGIN_VER}"
#   curl -fsSL "${BASE}/${NAME}"
#
# 즉 version을 올리는 것은 "그 태그에 바이너리가 있다"는 약속이다. 재사용
# 워크플로우는 바이너리를 만들지 못하므로 그대로 쓰면 DOWNLOAD_FAILED로
# 설치가 깨진다.
#
# 태그 push로 빌드를 잇는 방법도 안 된다. GITHUB_TOKEN으로 만든 태그는
# 다른 워크플로우를 트리거하지 않는다(재귀 방지). 그래서 판정 스크립트만
# claude-plugins에서 가져다 쓰고 빌드와 릴리스는 이 워크플로우가 직접 한다.
#
# 순서가 중요하다. 빌드를 끝낸 뒤에 version을 올린다. 반대로 하면 빌드가
# 실패했을 때 바이너리 없는 버전이 사용자에게 노출된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# update-sha.yml과 같은 그룹을 써서 직렬화한다. 둘 다 main push에 반응해
# 각자 커밋을 push하므로, 동시에 돌면 한쪽이 non-fast-forward로 튕긴다.
concurrency:
  group: main-push-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.v.outputs.next }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 판정 규칙은 모든 플러그인이 공유한다. 여기서 복제하지 않는다.
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          repository: jeongph/claude-plugins
          ref: main
          path: .release-tooling

      - name: Test version resolver
        run: bash .release-tooling/.github/scripts/next-version.test.sh

      - name: Resolve next version
        id: v
        run: |
          CURRENT=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          if [ -z "$CURRENT" ]; then
            echo "plugin.json에 version이 없어 건너뛴다"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "v$CURRENT" >/dev/null 2>&1; then
            RANGE="v$CURRENT..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "대상 범위: $RANGE (현재 $CURRENT)"

          set +e
          NEXT=$(git log --format=%B%x00 "$RANGE" | bash .release-tooling/.github/scripts/next-version.sh "$CURRENT")
          rc=$?
          set -e

          if [ "$rc" -eq 10 ]; then
            echo "릴리스할 변경이 없어 건너뛴다 (docs, chore, ci 등만 쌓임)"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ] || [ -z "$NEXT" ]; then
            echo "버전 계산 실패 (exit $rc)" >&2
            exit 1
          fi
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "v$NEXT 태그가 이미 있어 건너뛴다"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$CURRENT -> $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./... -v

  build:
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: v${{ needs.version.outputs.next }}
        run: |
          go build -ldflags="-s -w -X main.version=$VERSION" \
            -o claude-telemetry-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/claude-telemetry
      - uses: actions/upload-artifact@v4
        with:
          name: claude-telemetry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: claude-telemetry-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect binaries and checksums
        run: |
          mkdir -p release
          find dist -type f -name 'claude-telemetry-*' -exec mv {} release/ \;
          # glob을 바이너리로 한정한다. ./*를 쓰면 파일명이 "./claude-telemetry-..."로
          # 기록돼 setup.md의 `$2 == n` 매칭이 빗나가고(CHECKSUM_FAILED),
          # 리다이렉션으로 먼저 생긴 빈 checksums.txt까지 목록에 들어간다.
          (cd release && sha256sum claude-telemetry-* > checksums.txt)
          cat release/checksums.txt

      # 바이너리가 준비된 뒤에 version 을 올린다. 순서를 뒤집으면 빌드가
      # 실패했을 때 바이너리 없는 버전이 사용자에게 노출된다.
      - name: Bump manifest
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEXT\"/" .claude-plugin/plugin.json
          test "$(jq -r .version .claude-plugin/plugin.json)" = "$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore(release): $NEXT"
          # update-sha.yml도 같은 push에 반응해 커밋을 얹는다. 그쪽이 먼저
          # 끝나면 이 push가 non-fast-forward로 튕기므로 한 번 되감아 붙인다.
          git push || { git pull --rebase origin main && git push; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          gh release create "v$NEXT" --title "v$NEXT" --generate-notes release/*

      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          # setup.md가 이 이름들을 그대로 조립해 내려받는다. 하나라도 빠지면
          # 설치가 DOWNLOAD_FAILED로 깨지므로 여기서 확인하고 끝낸다.
          # 한 줄로 둔다. 여러 줄로 쓰면 값에 개행이 섞여 단어 분리가 어긋난다.
          BINARIES="claude-telemetry-darwin-amd64 claude-telemetry-darwin-arm64 claude-telemetry-linux-amd64 claude-telemetry-linux-arm64"

          ASSETS=$(gh release view "v$NEXT" --json assets --jq '.assets[].name' | sort)
          echo "$ASSETS"
          for want in checksums.txt $BINARIES; do
            printf '%s\n' "$ASSETS" | grep -qxF "$want" || { echo "에셋 누락: $want" >&2; exit 1; }
          done

          # 이름이 맞아도 checksums.txt의 형식이 어긋나면 설치는 CHECKSUM_FAILED로
          # 깨진다. setup.md와 같은 방식으로 실제 조회해 본다.
          for name in $BINARIES; do
            SUM=$(awk -v n="$name" '$2 == n {print $1}' release/checksums.txt)
            [ -n "$SUM" ] || { echo "checksums.txt에서 조회 실패: $name" >&2; cat release/checksums.txt >&2; exit 1; }
            echo "  $name  $SUM"
          done
